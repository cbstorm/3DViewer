[package]
name = "viewer3d"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A small, fast 3D model viewer (glTF/GLB, OBJ, STL) built on Vulkan"

[dependencies]
ash = "0.38"
ash-window = "0.13"
winit = "0.30"
raw-window-handle = "0.6"

egui = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
egui-ash-renderer = { version = "0.13", features = ["gpu-allocator"] }
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan"] }

glam = { version = "0.30", features = ["bytemuck"] }
gltf = { version = "1", features = ["KHR_materials_emissive_strength"] }
tobj = "4"
stl_io = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.15"

anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
naga = { version = "26", features = ["wgsl-in", "spv-out"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
